[AUTHOR]
NAME=EVCC LoxBerry Plugin Authors
EMAIL=evcc-loxberry@users.noreply.github.com

[PLUGIN]
VERSION=0.9.6
NAME=evcc
FOLDER=evcc
TITLE=EVCC - PV-Ueberschussladen

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide dieselbe Fassung fuehren, wird niemandem etwas
# angeboten; sobald der
# Zweig eine hoehere fuehrt, greift die Aktualisierung von selbst.
#
# Adressen NIE auf ein fremdes Repository richten: LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-EVCC/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-EVCC/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Die eigentliche Pruefung macht postroot.sh: es liest dpkg --print-architecture
# und laesst arm64, armhf, armel und amd64 durch - alles andere bricht mit einer
# klaren Meldung ab. Das ist aussagekraeftiger als eine Liste von
# LoxBerry-Architekturnamen, deckt sich hier aber mit ihr.
ARCHITECTURE=raspberry,x86
CUSTOM_LOGLEVELS=true
