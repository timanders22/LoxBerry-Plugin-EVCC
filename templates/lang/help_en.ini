; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "This plugin connects <b>EVCC</b> to Loxone. EVCC handles PV surplus charging across manufacturers; the plugin sets it up on the LoxBerry and translates its values into the form the Loxone energy manager expects."
K02 = "<b>Order of setup:</b>"
K03 = "Set up EVCC itself — wallbox, meters and vehicles in the EVCC interface on port 7070. The plugin only reads what is configured there."
K04 = "On the <i>Settings</i> tab, check the address and decide how many charge points and vehicles are to be published."
K05 = "Check on the <i>MQTT</i> tab whether the MQTT gateway is found. <b>Gateway&nbsp;V1:</b> the plugin brings its subscription itself. <b>From version&nbsp;2</b> the topic group appears in the subscriptions; tick the data points there according to the tick list on the <i>Integration into Loxone</i> tab."
K06 = "On the <i>Integration into Loxone</i> tab create the virtual inputs following the name table (no template for values), the commands on the output “LoxBerry MQTT-Gateway” (or button “MQTT command template”) and rebuild the four block lists from step 6 - energy flow, tariff and messages, charge point 1, control of charge point 1, home battery and tariff. The path via HTTP is shown there collapsed."
K07 = "On the <i>Test</i> tab, look at the self-check."
K08 = "<b>About the signs:</b> EVCC counts grid import as positive and battery discharge as positive — exactly like the Loxone energy manager. Only the unit differs: EVCC works in watts, the block in kilowatts. The plugin converts."
K09 = "<b>If values are missing:</b> The <i>Test</i> tab shows which fields could be found in the reply from EVCC. If a device is missing — no home battery, no PV system — that is correct. If something is missing that ought to be there, the <i>Raw reply</i> button shows the unaltered reply from EVCC."
K10 = "EVCC documentation: <a href='https://docs.evcc.io/' target='_blank'>docs.evcc.io</a>"
K11 = "<b>Try a command first:</b> append <span class='sm-mono'>&amp;probe=1</span> to a command address and the plugin checks everything the real command checks - token, the permission in the <i>Settings</i> tab, command, charge point, value and command brake - and answers like the real command with <span class='sm-mono'>PROBE=1</span>. Nothing is sent to EVCC, and the command brake remembers nothing. Only <span class='sm-mono'>probe=1</span> counts; any other value, and a dry run on a reading action, is rejected with HTTP 400."
K12 = "<b>Writer watch:</b> the endpoint remembers who sends switching commands - the identifier from <span class='sm-mono'>&amp;von=</span> (the template sets <span class='sm-mono'>von=loxone</span>) and the sender address. If several writers send commands within the time window (default 15 minutes), this is shown in the log, in the <i>Test</i> tab (writers of the last 24 hours) and in the response as <span class='sm-mono'>;SCHREIBER=n</span>; nothing is rejected. Only with <i>Reject foreign writers</i> (off by default) does a writer that is not in the list get HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span>. An invalid identifier is rejected with HTTP 400 <span class='sm-mono'>GRUND=VON</span>; an address without <span class='sm-mono'>von</span> always works."
K13 = "<b>EVCC next to home batteries:</b> if Loxone runs the home batteries and the priority is <i>home batteries before the car</i>, EVCC only gets the rest. For this, Loxone sets <span class='sm-mono'>residualleistung</span> to the power in watts that the batteries with priority can still take; according to its documentation EVCC keeps a positive value as a reserve and charges only with what is exported beyond it. If a home battery is force-discharged (for example in an expensive hour), EVCC would take the resulting export for PV surplus and charge the car from the battery. Therefore the discharge power is added to <span class='sm-mono'>residualleistung</span> during that time, and <span class='sm-mono'>batterieboost</span> stays off (0) - switched on, EVCC deliberately discharges the home battery into the car. <span class='sm-mono'>entladeregelung</span> only affects a battery that EVCC itself knows and controls. The command brake lets a changed value through at most every 10 seconds; a value pushed faster is refused with HTTP 429, and the last refused value is sent by the plugin itself once the 10 seconds are over (since 0.9.43). Loxone still sends the residual power in steps (for example rounded to 100 W) and only on change. As long as EVCC has no charge point, none of this is needed."
K14 = "<b>EVCC driving a battery plugin:</b> if EVCC itself controls a home battery through the endpoint of a LoxBerry plugin (in <span class='sm-mono'>/etc/evcc.yaml</span>, for example BatterieBMS with <span class='sm-mono'>aktion=batteriemodus</span>), <span class='sm-mono'>&amp;von=evcc</span> belongs on that address. The writer watch of the battery plugin then shows EVCC by name instead of <i>without identifier</i>, and BatterieBMS recognises EVCC by it for its <i>Lead</i> setting. This plugin never changes <span class='sm-mono'>/etc/evcc.yaml</span>; the address is entered in EVCC itself."
