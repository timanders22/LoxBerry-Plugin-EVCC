; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Dieses Plugin verbindet <b>EVCC</b> mit Loxone. EVCC regelt das PV-Überschussladen herstellerübergreifend; das Plugin richtet es auf dem LoxBerry ein und übersetzt seine Werte in die Form, die der Loxone-Energiemanager erwartet."
K02 = "<b>Reihenfolge beim Einrichten:</b>"
K03 = "EVCC selbst einrichten — Wallbox, Zähler und Fahrzeuge in der EVCC-Oberfläche unter Port 7070. Das Plugin liest nur, was dort konfiguriert ist."
K04 = "Im Reiter <i>Einstellungen</i> die Adresse prüfen und festlegen, wie viele Ladepunkte und Fahrzeuge ausgegeben werden sollen."
K05 = "Im Reiter <i>MQTT</i> das Abo in das MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K06 = "Im Reiter <i>Einbindung in Loxone</i> die beiden Vorlagen erzeugen, in Loxone Config importieren und die vier Baustein-Listen aus Schritt 4 nachbauen - Energiefluss, Tarif und Meldungen, Ladepunkt 1, Steuerung, Hausspeicher und Tarif -, je mit Bild und Schritt-für-Schritt-Anleitung."
K07 = "Im Reiter <i>Test</i> die Selbstprüfung ansehen."
K08 = "<b>Zu den Vorzeichen:</b> EVCC zählt Netzbezug positiv und Speicherentladung positiv — genau wie der Loxone-Energiemanager. Nur die Einheit ist eine andere: EVCC rechnet in Watt, der Baustein in Kilowatt. Das Plugin rechnet um."
K09 = "<b>Wenn Werte fehlen:</b> Der Reiter <i>Test</i> zeigt, welche Felder sich in der Antwort von EVCC finden ließen. Fehlt ein Gerät — kein Hausspeicher, keine PV-Anlage —, ist das richtig so. Fehlt etwas, das es geben müsste, zeigt der Knopf <i>Rohantwort</i> die unveränderte Antwort von EVCC."
K10 = "Dokumentation zu EVCC: <a href='https://docs.evcc.io/' target='_blank'>docs.evcc.io</a>"
K11 = "<b>Befehl erst ausprobieren:</b> Hängt man an eine Befehlsadresse <span class='sm-mono'>&amp;probe=1</span> an, prüft das Plugin alles wie beim echten Befehl - Token, Freigabe im Reiter <i>Einstellungen</i>, Befehl, Ladepunkt, Wert und Befehlsbremse - und antwortet wie echt mit <span class='sm-mono'>PROBE=1</span>. An EVCC geht nichts, und die Befehlsbremse merkt sich nichts. Nur <span class='sm-mono'>probe=1</span> gilt; jeder andere Wert und ein Trockenlauf an einer lesenden Aktion werden mit HTTP 400 abgewiesen."
K12 = "<b>Schreiber-Wache:</b> Der Endpunkt merkt sich, wer schaltende Befehle schickt - die Kennung aus <span class='sm-mono'>&amp;von=</span> (die Vorlage setzt <span class='sm-mono'>von=loxone</span>) und die Adresse des Absenders. Schicken innerhalb des Zeitfensters (ab Werk 15 Minuten) mehrere Schreiber Befehle, steht das im Protokoll, im Reiter <i>Test</i> (Schreiber der letzten 24 Stunden) und in der Antwort als <span class='sm-mono'>;SCHREIBER=n</span>; abgewiesen wird dabei nichts. Erst mit <i>Fremde Schreiber abweisen</i> (ab Werk aus) bekommt ein Schreiber, der nicht in der Liste steht, HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span>. Eine ungültige Kennung wird mit HTTP 400 <span class='sm-mono'>GRUND=VON</span> abgewiesen; eine Adresse ohne <span class='sm-mono'>von</span> geht immer."
K13 = "<b>EVCC neben Hausspeichern:</b> Führt Loxone die Hausspeicher, und gilt der Vorrang <i>Hausspeicher vor Auto</i>, bekommt EVCC nur den Rest. Dafür setzt Loxone <span class='sm-mono'>residualleistung</span> auf die Leistung in Watt, die die vorrangigen Speicher gerade noch aufnehmen können; einen positiven Wert lässt EVCC laut seiner Dokumentation als Reserve stehen und lädt nur mit dem, was darüber hinaus eingespeist wird. Wird ein Hausspeicher zwangsentladen (etwa in einer teuren Stunde), hielte EVCC die dabei entstehende Einspeisung für PV-Überschuss und lüde das Auto aus dem Speicher. Deshalb kommt die Entladeleistung in dieser Zeit mit auf <span class='sm-mono'>residualleistung</span>, und <span class='sm-mono'>batterieboost</span> bleibt aus (0) - eingeschaltet entlädt EVCC den Hausspeicher absichtlich ins Auto. <span class='sm-mono'>entladeregelung</span> wirkt nur auf einen Speicher, den EVCC selbst kennt und steuert. Die Befehlsbremse lässt einen geänderten Wert höchstens alle 10 Sekunden durch; einen schneller nachgeschobenen weist sie mit HTTP 429 ab und reicht den zuletzt abgewiesenen nach Ablauf der 10 Sekunden selbst nach (seit 0.9.43). Loxone sendet die Residualleistung trotzdem gestuft (etwa auf 100 W gerundet) und nur bei Änderung. Solange EVCC keinen Ladepunkt führt, ist nichts davon nötig."
K14 = "<b>EVCC an einem Speicher-Plugin:</b> Steuert EVCC selbst einen Hausspeicher über den Endpunkt eines LoxBerry-Plugins (in <span class='sm-mono'>/etc/evcc.yaml</span>, etwa BatterieBMS mit <span class='sm-mono'>aktion=batteriemodus</span>), gehört <span class='sm-mono'>&amp;von=evcc</span> an diese Adresse. Die Schreiber-Wache des Speicher-Plugins zeigt EVCC dann mit Namen statt als <i>ohne Kennung</i>, und BatterieBMS erkennt EVCC daran für die Einstellung <i>Führung</i>. Dieses Plugin ändert <span class='sm-mono'>/etc/evcc.yaml</span> nie; die Adresse trägt man in EVCC selbst ein."
