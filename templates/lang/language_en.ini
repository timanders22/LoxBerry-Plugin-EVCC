L_MQTT_TOPIC = "MQTT topic (prefix)"
L_MQTT_VOLLSEND = "Send all values again, even unchanged, every … minutes"
H_MQTT_VOLLSEND = "Otherwise only what has changed is sent; the heartbeat (<span class='sm-mono'>ok</span>, <span class='sm-mono'>ts</span>, <span class='sm-mono'>dienst</span>, <span class='sm-mono'>betriebsbereit</span>) immediately on a change, otherwise at most every 30 seconds. <b>The version of your MQTT gateway could not be determined.</b> Under <b>V1</b> this full send brings the non-retained values back to the Miniserver after its own restart. Under <b>V2</b> the gateway does not pass on unchanged values; there you get the current state with <span class='sm-mono'>resend</span> on the UDP input or with a subscription set to <span class='sm-mono'>Noncached</span>. <b>Default 15 minutes</b>, <b>0 = off</b> (then only after a LoxBerry restart, an update and a prefix change)."
