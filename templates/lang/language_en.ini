SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "Set up EVCC itself: wallbox, meters and vehicle in the EVCC interface (port 7070). The plugin only reads what is configured there. If you want to charge by electricity price, enter the tariff there as well."
S1_SCHRITT2 = "In the plugin, tab “%s”: check “%s”, leave “%s” and “%s” at 2 each, tick “%s” (only with a tariff in EVCC) and tick “%s” (for choosing the charging mode and for the pages “EVCC Steuerung” and “EVCC Hausspeicher und Tarif”). Save."
S1_SCHRITT3 = "Tab “%1$s”: “%2$s” stays on, topic “%3$s”. Under MQTT gateway V1 the plugin brings its subscription “%3$s/#” itself; under V2 tick the data points according to the tick list (step 2 above). Also tick “%4$s” if Loxone is to control EVCC."
S1_SCHRITT4 = "Create the inputs following the name table above (step 3): one virtual input per value (Periphery → Virtual Inputs → Virtual input), name exactly as there, do not tick “Use as digital input”. No template – whoever copies this page from the sample project gets the inputs with it."
S1_SCHRITT5 = "The commands hang on the shared output “%1$s” (template from the sample project, address /dev/udp/<LoxBerry address>/11884) – or button “%2$s” (step 5 above) for an output of its own. This path needs no token."
S1_SCHRITT6 = "Create the page “EVCC” and drag the virtual inputs of the list onto the page, plus the command “%2$s” on the output “%1$s”."
S1_SCHRITT7 = "Periphery → Virtual Inputs → Virtual text input, name exactly: %s – the way the MQTT gateway names the topic. With gateway V2 tick the datapoint in the subscriptions."
S1_SCHRITT8 = "Create two notifications (Periphery → Messages → Notification): “Ladung fertig” and “EVCC Meldung”, texts as in the list. Each gets exactly one connection."
S1_SCHRITT9 = "Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them from top to bottom according to the column “%s”. OR and AND have two inputs each. On #21 (analog value validation on #1, Tmc 300 s): Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
S1_SCHRITT10 = "Status blocks: the inputs from V5 on only appear after clicking the “+” on the block (#3 four times, #16 twice, #27 once, #40 three times). The rows are in the column “%s” and are entered by hand, in the given order, the row without condition last."
S1_SCHRITT11 = "Radio buttons “Lademodus Ladepunkt 1”: name three buttons, text for “no button selected” “Aus”, retentive on."
S1_SCHRITT12 = "Energy manager: in the properties window create consumer 1 “Wallbox (EVCC regelt)” (name as in the table), do NOT connect its output OL1, its feedback IL1 to %s. MinSoc 20 %%. EVCC switches the wallbox, not the energy manager."
S1_SCHRITT13 = "Save and transfer to the Miniserver. Test: “EVCC Zustand” shows “in Ordnung”, “Energiefluss” the same numbers as the EVCC interface; on the tab “%s” of the plugin the first row is green."
S1_H1 = "Choose “Lademodus Ladepunkt 1” in the app. If someone chooses the mode in the EVCC app, it stays until it is chosen anew in Loxone; “Wallbox Status” shows the actual mode."
S1_H2 = "Do not build two price automations: EVCC decides whether to charge by price (price limit on the page “EVCC Steuerung”). “Günstige Stunde” (#10/#11) is a display and the connection for your own consumers, NOT for the charging mode."
S1_H3 = "If you switch on the voice output in the plugin, you get failure and end of charging twice (announcement and notification) – deselect one."
S1_H4 = "If EVCC runs on another computer, %s is always 0; “EVCC Zustand” only evaluates it when EVCC does not answer."
S1_H5 = "Commands via MQTT need two ticks: “%1$s” (MQTT tab) and “%2$s” (Settings tab). The Test tab shows the acknowledgement of each command."
S1_H6 = "Read the threshold of the solar forecast (#13) first: if “Solarprognose” shows numbers above 1000, EVCC delivers Wh – then multiply the thresholds by 1000."
S1_H7 = "If you built this page from the list of 0.9.42: there %s hung on “Günstig und Preis gültig” and switched the charging mode to OFF in every hour that was not cheap. Before rebuilding, delete the connections #4 (output Off) → #5, #8 → #9 and #11 → #12, then wire as in the list."
S2_SCHRITT1 = "Create the inputs following the name table above, as on page “EVCC” (virtual input, name exactly as there)."
S2_SCHRITT2 = "Create the page “EVCC Ladepunkt 1” and drag the 26 virtual inputs of the list onto the page. For %s switch on “Statistics” in the properties window."
S2_SCHRITT3 = "Periphery → Virtual Inputs → Virtual text input, name exactly: %s. With gateway V2 tick the datapoint in the subscriptions."
S2_SCHRITT4 = "Place five status blocks; the inputs from V5 on only appear after clicking the “+” on the block (#9 four times, #16 twice, #24 three times). Enter the rows from the column “%s” by hand, the row without condition last. Wire, save, transfer."
S2_H1 = "Cost, price per kWh and CO₂ of the session only exist with a tariff in EVCC; otherwise they are 0."
S2_H2 = "-1 means: EVCC does not deliver this value (no vehicle, no plan) – not an error."
S2_H3 = "Charge point 2: rebuild the same page with lp2 instead of lp1 in the names and the text input %s."
S3_SCHRITT1 = "In the plugin set the ticks “%1$s” (MQTT tab) and “%2$s” (Settings tab) – otherwise the command bridge acknowledges every command with a refusal (Test tab)."
S3_SCHRITT2 = "Create the page “EVCC Steuerung” and create the 13 commands of the list on the output “%s” (command for analog value or for ON/OFF as in the column Parameters)."
S3_SCHRITT3 = "Create virtual inputs (Periphery → Virtual Inputs → Virtual input, “Use in visualisation” on): sliders with Min, Max, step and start value as in the list; switch “Battery Boost Ladepunkt 1” (start value off); push buttons “Ladeplan löschen” and “Fahrzeug-Zuordnung lösen”."
S3_SCHRITT4 = "Place the radio buttons “Phasen Ladepunkt 1” (two buttons, “no button selected” = “automatisch”, retentive on) and the formula IF(I1==2;3;I1). Wire, save, transfer."
S3_SCHRITT5 = "Price limit and energy target carry <v.3> (three decimals) – with <v.0> 0.25 would become a plain 0. The command bridge does not round."
S3_SCHRITT6 = "Test: change the charge limit and wait 15 s – on page “EVCC” %s shows the new value, and so does the EVCC interface."
S3_H1 = "Command brake: the plugin accepts a new value per command at most every 10 s. If a slider is moved faster, it remembers the value and sends it itself with the next poll once the 10 s are over – only the last one per command; the acknowledgement says “angenommen”. The same value within 60 s does not go to EVCC again. The feedback is then shown on page “EVCC Ladepunkt 1”."
S3_H2 = "Charging plan: set “Abfahrt Ziel-Ladestand” first, then “Abfahrt in Stunden” – the plan counts from the moment the second value arrives. If only the target is changed later, the plugin counts the hours anew from THAT moment."
S3_H3 = "Leave Battery Boost off if the home battery has priority over the car (README, section “EVCC neben Hausspeichern”)."
S3_H4 = "Use “Energieziel” only for vehicles that do not report their state of charge; otherwise use “Ladegrenze”."
S3_H5 = "Choosing a vehicle (not part of the list): command for ON “publish <prefix>/befehl/lp1/fahrzeug <vehicle name>” with the name from EVCC (letters, digits, _ . - and spaces); one push button per vehicle. Via HTTP the template contains one command %s etc. for this."
S3_H6 = "Charge point 2: the same commands with lp2 instead of lp1 in the topic."
S4_SCHRITT1 = "Only take this over if EVCC itself knows a home battery (EVCC interface). If Loxone or another plugin runs the battery (BatterieBMS, Einspeisebremse, AnkerSolix, Zendure), leave out the commands #1–#14 – otherwise two controllers switch the same battery. The values #15–#33 never do harm."
S4_SCHRITT2 = "Create the page “EVCC Hausspeicher und Tarif”, create the 7 commands of the list on the output “%s” and drag the 16 virtual inputs onto the page."
S4_SCHRITT3 = "Create the virtual inputs (sliders, switch, push button) as in the list, “Use in visualisation” on; radio buttons “Hausspeicher Betriebsart” (two buttons, “no button selected” = “normal”, retentive on)."
S4_SCHRITT4 = "Status #23 and #30: the inputs from V5 on only appear after clicking the “+” (#23 four times, #30 twice); enter the rows from the column “%s” by hand. Wire, save, transfer."
S4_SCHRITT5 = "Send the grid charging limit with <v.3> (three decimals); with <v.0> 0.1 would become a plain 0."
S4_H1 = "“halten” and “aus dem Netz laden” act until “normal” is chosen. After a restart of the Miniserver the choice stays (retentive)."
S4_H2 = "Residual power: when another battery is force-discharged, add its discharge power here as well, otherwise EVCC charges the car from that battery (README, section “EVCC neben Hausspeichern”)."
S4_H3 = "“Netzladen Hausspeicher aus” deletes the limit in EVCC; the slider still shows the old value afterwards – only moving it again sets the limit again."
S4_H4 = "Command brake as on page “EVCC Steuerung”: a value that comes less than 10 s after the previous one is remembered and sent afterwards once the 10 s are over – only the last one."
