H_VERBINDUNG = "Connection to EVCC"
KEIN_LADEPUNKT = "EVCC is running but has <b>no loadpoint</b>. Wallbox-related values therefore stay empty. Check at <a href='%1$s' target='_blank'>%1$s</a>."
K_SICHERN = "Back up settings"
K_ZURUECK = "Restore"
L_FAHRZEUGE = "Vehicles to publish"
