M_S3 = "<b>3. Create inputs.</b> One <b>virtual input</b> per value (for text a <b>virtual text input</b>), name exactly as in the table – the MQTT gateway delivers under this name. There is no template for values: the names are enough."
M_S3_DIGITAL = "Do not tick “Use as digital input” – all values are analog, the 0/1 values too."
M_S3_RECHTE = "The LoxBerry user at the Miniserver needs rights on these inputs."
M_S3_MUSTER = "Whoever copies the pages from the sample project gets the inputs with them."
M_S3_PRAEFIX = "Changed the prefix on the <i>MQTT</i> tab? Then all names change."
M_S3_OHNE = "If EVCC does not deliver a value, the plugin sends <b>-1</b> (states, rank, forecast, CO₂, also yes/no values) or <b>-999</b> (prices, price limit, residual power – values with a sign) and “-” for texts. Measured values (power, energy, state of charge) stay 0: a missing value means “device not present” there, and -999 kW at the energy manager would switch loads on. Via HTTP the same applies, only yes/no values stay 0 there (the old template creates digital inputs). Whoever checks for “= 0” in an existing installation will see -1 or -999 from now on."
M_KOPIEREN = "copy"
M_KOPIERT = "copied"
M_S4 = "<b>4. Failure detection.</b> Analog value validation on %1$s: Tmc 300 s (the sign of life arrives every 30 s, never retained, even if EVCC does not answer; ten cycles, single lost messages report nothing), Min 0, Max 999, constant 1 at En and remove the tick at ‘En’ in the properties. Whether EVCC answers is told by %2$s (1 = values current), why not by %3$s. Do not calculate an age in seconds from a timestamp – Loxone calculates in local time; <span class='sm-mono'>ts</span> only shows the time of the last poll. Whoever sets the poll interval above 30 s (up to 60 s) need not change anything: the sign of life then comes with every run."
M_S5 = "<b>5. Commands.</b> Charging mode, charge limits, currents, charging plan and home battery go through the command bridge: Loxone sends to the UDP input of the MQTT gateway, the plugin checks and executes as via the endpoint – range, command brake, writer watch (identifier “mqtt”), charging plan from two values. Two ticks: “Accept commands via MQTT” (<i>MQTT</i> tab, off from the factory) and “Steuerung aus Loxone zulassen” (<i>Settings</i> tab)."
M_S5_SPERRE = "Lock time of the bridge 0 s: the command brake of the plugin applies (the same value within 60 s changes nothing, a different one after 10 s at the earliest, the last refused one is sent afterwards). A second lock would swallow an intended change back A → B → A."
M_S5_NICHTS = "Under gateway V1 and V2 nothing has to be entered or ticked for commands."
M_S5_LP = "The table shows charge point 1; for charge points 2 to 4 the topic carries lp2 … lp4 instead of lp1."
M_S5_KEINE = "The command list could not be read (bin/befehlsbruecke.php or bin/befehle_zuordnung.php is missing or broken) – see the <i>Test</i> tab."
M_S5_VORLAGE = "The template creates an output of its own “EVCC MQTT-Befehle” (address /dev/udp/&lt;LoxBerry&gt;/&lt;UDP port&gt;), per configured charge point. Whoever uses the sample project takes the commands on the shared output “LoxBerry MQTT-Gateway” instead (pages “EVCC”, “EVCC Steuerung”, “EVCC Hausspeicher und Tarif”)."
M_S5_FACHLEUTE = "For experts: with its own <span class='sm-mono'>mqtt</span> section in evcc.yaml EVCC also accepts <span class='sm-mono'>evcc/…/set</span> – then without the checks of this plugin (ticks, range, brake, watch, charging plan, acknowledgement), with EVCC’s own values (mode names, true/false, time in UTC) and with vehicle names in the topic. The plugin does not create this section."
M_S8 = "<b>8. Cross-check – has it arrived?</b> Look at the value of %1$s in Loxone Config – it changes every 30 s. %2$s is 1 as long as EVCC answers. If everything stands still: look at the rows MQTT and name table on the <i>Test</i> tab. A command is checked by its acknowledgement on the <i>Test</i> tab (command bridge, “Last”)."
H_HTTP = "Existing installations: path via HTTP"
HTTP_ERKLAERUNG = "Up to 0.9.44 this was the path of this plugin. It keeps working unchanged: templates, token, addresses and failure detection via <span class='sm-mono'>ALTER_S</span> are here. Since 0.9.45 the line also sends -1/-999 instead of 0 for missing states, prices, CO₂ and forecasts (step 3 above)."

[SPOT]
EINLEITUNG = "EVCC knows the <b>spot electricity price</b> (Tibber, aWATTar, Octopus, EPEX Spot) and can charge accordingly. The plugin passes price and switching state through to Loxone - <b>the decision itself is made by EVCC</b>, not by Loxone."
GESPERRT = "The tariff values appear once <i>use tariffs</i> is ticked on the Settings tab. Without a tariff configured in EVCC there is nothing to deliver - better to leave the tick off than to send forty zeros to Loxone."
GRENZE_EINHEIT = "<b>Mind the unit:</b> the limit is given in <b>currency per kWh</b>, so <span class='sm-mono'>0.25</span> for 25&nbsp;cents - not in cents. Hence <span class='sm-mono'>&lt;v.3&gt;</span> with three decimals; with <span class='sm-mono'>&lt;v.0&gt;</span> 0.25 would become a plain 0 and the wallbox would only charge at negative prices."
GRENZE_GESPERRT = "Setting the limit from Loxone requires control from Loxone to be enabled on the Settings tab. Reading the price works without it."
GRENZE_TEXT = "The price up to which charging is allowed is called <span class='sm-mono'>smartCostLimit</span> in EVCC. To make it adjustable from Loxone - via a memory flag or the visualisation - create a virtual output:"
H = "Charging by electricity price (smart cost)"
H_GRENZE = "Setting the price limit from Loxone"
H_REZEPT = "A workable setup in Loxone"
H_WERTE = "These values are available"
RANG_REZEPT = "<b>The rank is the useful number - together with <span class='sm-mono'>EVCC_PREIS_OK</span>.</b> Instead of building a second price automation in Loxone, a comparator is enough: <span class='sm-mono'>EVCC_PREIS_RANG less than or equal to 6</span> means in the six cheapest of the known hours. <b>Only release together with <span class='sm-mono'>EVCC_PREIS_OK = 1</span></b> (via an AND): without valid prices the rank is -1, and a comparison with less than or equal to 6 would always be true. The decision when to actually charge is still made by EVCC."
REZEPT = "What works well: <span class='sm-mono'>EVCC_TARIF_NETZ</span> as an analogue input into a <b>statistics</b> block, so the price curve shows up in the daily chart. <span class='sm-mono'>EVCC_LP1_SMARTCOST_AKTIV</span> onto a status display - then it is obvious at a glance whether charging is happening because of the low price or for some other reason. And for a price limit in the visualisation: an <b>analogue memory</b> with a step of 0.01 feeding the virtual output above."
WARNUNG = "<b>Do not build a second automation.</b> It is tempting to write logic in Loxone that switches the charge mode to <i>now</i> when electricity is cheap. That works against EVCC's own price automation: EVCC switches off because the price has risen again, Loxone switches back on in the next cycle. Either EVCC controls (then only read in Loxone, and at most set the limit) or Loxone controls (then configure no tariff in EVCC)."
WERTE_TEXT = "The names match the command recognitions in the virtual-input template. Prices arrive in the tariff's currency, per kWh."
Z_AKTIV = "1 while EVCC is charging <i>because the price is low</i>, 0 = not; -1 = EVCC does not deliver a value. This is the value you actually want on display in Loxone - not the price itself."
Z_ANZAHL = "How many hours the preview covers (-1 = no valid prices)"
Z_BESTE = "Hour of day with the lowest price (0 to 23, -1 = no valid prices)"
Z_CO2 = "CO₂ content of grid electricity in g/kWh, if such a tariff is configured. EVCC can charge by this instead of by price."
Z_EINSPEISUNG = "Payment per kWh fed into the grid. A fixed figure for most installations."
Z_MAX = "Highest known energy price of the preview"
Z_MIN = "Lowest known energy price of the preview"
Z_NETZ = "Current working price per kWh from the grid. With spot tariffs it changes hourly, with fixed tariffs it stands still - both are correct."
Z_RANG = "Rank of the current hour - 1 is the cheapest, -1 means: no valid prices"
Z_SCHNITT = "Average across all known hours"
Z_OK = "1 if the prices apply to the current hour (freshly fetched or from an earlier request, as long as it covers the hour), otherwise 0. Rank, number of hours and cheapest hour only apply together with 1."

[DIREKT]
ABWAEGUNG = "<b>In favour:</b> one link fewer in the chain. If the LoxBerry fails while EVCC keeps running, Loxone still switches.<br><b>Against:</b> there is no feedback Loxone could evaluate - this plugin's endpoint answers with <span class='sm-mono'>OK=1</span> or a reason, EVCC answers with raw JSON. There is no range checking; a mistyped state of charge of 1000 passes straight through. And nothing appears in this plugin's log when somebody later asks who switched the wallbox off. <b>Recommendation:</b> use the plugin route and keep this one in mind as a fallback."
EINLEITUNG = "Loxone can address EVCC <b>without this plugin</b> - EVCC's REST interface accepts simple calls. This is meant as a fallback, not as the better route."
H = "Fallback: Loxone talks to EVCC directly"
H_ABWAEGUNG = "Weighing it up"
H_BEDINGUNG = "One condition - and it is a hard one"
METHODE = "Set <b>method POST</b> in the virtual output (for some paths EVCC expects PUT - see the EVCC documentation under <span class='sm-mono'>/api/</span>). Loadpoints are counted from 1 here, as in the EVCC user interface."
PASSWORT_GESETZT = "<b>Not possible here.</b> A password is stored for this EVCC instance on the Settings tab. EVCC then expects it as an <span class='sm-mono'>Authorization: Bearer</span> header - and a virtual output in Loxone Config cannot send a free-form header (the user and password fields produce <i>Basic</i> authentication, which EVCC does not accept). The route through this plugin is the only one here - it sets the header itself."
PASSWORT_LEER = "No password is stored for this EVCC instance. EVCC therefore accepts calls without authentication, and a virtual output in Loxone can issue them directly. <b>Bear in mind:</b> that then applies to everyone on the network, not just to Loxone."
Z_BATTERIE = "Hold the house battery (<span class='sm-mono'>normal</span>, <span class='sm-mono'>hold</span> or <span class='sm-mono'>charge</span>)."
Z_LIMITSOC = "Target state of charge of the vehicle in percent."
Z_MODUS = "Set the charge mode (<span class='sm-mono'>off</span>, <span class='sm-mono'>now</span>, <span class='sm-mono'>minpv</span> or <span class='sm-mono'>pv</span>)."

