M_RECONNECT = "After a restart of the Miniserver the central <span class='sm-mono'>reconnect</span> (sample project, page “LoxBerry MQTT-Gateway”) fetches the cached values; the states are retained anyway, status_zaehler comes within 30 s, the rest at the latest with the full send (MQTT tab)."
