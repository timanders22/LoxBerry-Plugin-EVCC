M_S1 = "<b>1. Switch MQTT on.</b> MQTT is the path of the LoxBerry plugins sample project: the plugin sends the values to the broker, the LoxBerry MQTT gateway passes them on to the Miniserver, and the commands come back through the command bridge. MQTT is on from the factory (<i>MQTT</i> tab, “Publish values via MQTT”). The path via HTTP stays for existing installations – collapsed below."
M_S1_AUS = "<b>MQTT is switched off.</b> Without the tick “Publish values via MQTT” on the <i>MQTT</i> tab nothing arrives on this path, and the command bridge accepts nothing."
M_S2 = "<b>2. The MQTT gateway.</b> The topic group of this plugin:"
