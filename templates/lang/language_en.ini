VORLAGE_TEXT = "Instead of creating every value by hand as a virtual input: this file contains all values with unit, limits and comment. <b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing - importing twice yields duplicate blocks."
Z_GPWR = "Grid power in kW. Negative means feed-in - the same way round in EVCC and in the Energy Manager."
Z_LAST = "Charging power of the loadpoint as the <i>status input</i> of the load, so the block knows about it when distributing."
Z_PPWR = "Production of the PV system in kW. Used for visualisation only."
Z_SOC = "State of charge of the house battery in percent."
Z_SPWR = "Battery power in kW. Negative means the battery is charging - the signs match here too."

[SPOT]
EINLEITUNG = "EVCC knows the <b>spot electricity price</b> (Tibber, aWATTar, Octopus, EPEX Spot) and can charge accordingly. The plugin passes price and switching state through to Loxone - <b>the decision itself is made by EVCC</b>, not by Loxone."
GESPERRT = "The tariff values appear once <i>use tariffs</i> is ticked on the Settings tab. Without a tariff configured in EVCC there is nothing to deliver - better to leave the tick off than to send forty zeros to Loxone."
GRENZE_EINHEIT = "<b>Mind the unit:</b> the limit is given in <b>currency per kWh</b>, so <span class='sm-mono'>0.25</span> for 25&nbsp;cents - not in cents. Hence <span class='sm-mono'>&lt;v.3&gt;</span> with three decimals; with <span class='sm-mono'>&lt;v.0&gt;</span> 0.25 would become a plain 0 and the wallbox would only charge at negative prices."
GRENZE_GESPERRT = "Setting the limit from Loxone requires control from Loxone to be enabled on the Settings tab. Reading the price works without it."
GRENZE_TEXT = "The price up to which charging is allowed is called <span class='sm-mono'>smartCostLimit</span> in EVCC. To make it adjustable from Loxone - via a memory flag or the visualisation - create a virtual output:"
H = "Charging by electricity price (smart cost)"
H_GRENZE = "Setting the price limit from Loxone"
H_REZEPT = "A workable setup in Loxone"
H_WERTE = "These values are available"
REZEPT = "What works well: <span class='sm-mono'>EVCC_TARIF_NETZ</span> as an analogue input into a <b>statistics</b> block, so the price curve shows up in the daily chart. <span class='sm-mono'>EVCC_LP1_SMARTCOST_AKTIV</span> onto a status display - then it is obvious at a glance whether charging is happening because of the low price or for some other reason. And for a price limit in the visualisation: an <b>analogue memory</b> with a step of 0.01 feeding the virtual output above."
WARNUNG = "<b>Do not build a second automation.</b> It is tempting to write logic in Loxone that switches the charge mode to <i>now</i> when electricity is cheap. That works against EVCC's own price automation: EVCC switches off because the price has risen again, Loxone switches back on in the next cycle. Either EVCC controls (then only read in Loxone, and at most set the limit) or Loxone controls (then configure no tariff in EVCC)."
WERTE_TEXT = "The names match the command recognitions in the virtual-input template. Prices arrive in the tariff's currency, per kWh."
Z_AKTIV = "1 while EVCC is charging <i>because the price is low</i>. This is the value you actually want on display in Loxone - not the price itself."
Z_CO2 = "CO&#8322; content of grid electricity in g/kWh, if such a tariff is configured. EVCC can charge by this instead of by price."
Z_EINSPEISUNG = "Payment per kWh fed into the grid. A fixed figure for most installations."
Z_NETZ = "Current working price per kWh from the grid. With spot tariffs it changes hourly, with fixed tariffs it stands still - both are correct."

[DIREKT]
ABWAEGUNG = "<b>In favour:</b> one link fewer in the chain. If the LoxBerry fails while EVCC keeps running, Loxone still switches.<br><b>Against:</b> there is no feedback Loxone could evaluate - this plugin's endpoint answers with <span class='sm-mono'>OK=1</span> or a reason, EVCC answers with raw JSON. There is no range checking; a mistyped state of charge of 1000 passes straight through. And nothing appears in this plugin's log when somebody later asks who switched the wallbox off. <b>Recommendation:</b> use the plugin route and keep this one in mind as a fallback."
EINLEITUNG = "Loxone can address EVCC <b>without this plugin</b> - EVCC's REST interface accepts simple calls. This is meant as a fallback, not as the better route."
H = "Fallback: Loxone talks to EVCC directly"
H_ABWAEGUNG = "Weighing it up"
H_BEDINGUNG = "One condition - and it is a hard one"
METHODE = "Set <b>method POST</b> in the virtual output (for some paths EVCC expects PUT - see the EVCC documentation under <span class='sm-mono'>/api/</span>). Loadpoints are counted from 1 here, as in the EVCC user interface."
PASSWORT_GESETZT = "<b>Not possible here.</b> A password is stored for this EVCC instance on the Settings tab. EVCC then expects it as an <span class='sm-mono'>Authorization: Bearer</span> header - and a virtual output in Loxone Config cannot send a free-form header (the user and password fields produce <i>Basic</i> authentication, which EVCC does not accept). The route through this plugin is the only one here - it sets the header itself."
PASSWORT_LEER = "No password is stored for this EVCC instance. EVCC therefore accepts calls without authentication, and a virtual output in Loxone can issue them directly. <b>Bear in mind:</b> that then applies to everyone on the network, not just to Loxone."
Z_BATTERIE = "Hold the house battery (<span class='sm-mono'>normal</span>, <span class='sm-mono'>hold</span> or <span class='sm-mono'>charge</span>)."
Z_LIMITSOC = "Target state of charge of the vehicle in percent."
Z_MODUS = "Set the charge mode (<span class='sm-mono'>off</span>, <span class='sm-mono'>now</span>, <span class='sm-mono'>minpv</span> or <span class='sm-mono'>pv</span>)."

