S1 = "A virtual HTTP input querying this address:"
S1_ABFRAGE = "Poll every 30 s. The token protects the endpoint - it lives in the unauthenticated area so Loxone can reach it without credentials. If you regenerate the token, the address in Loxone must be updated."
S1_T = "Step 1: virtual HTTP input"
S2 = "One command per value with the recognition pattern <span class='sm-mono'>\iFIELDNAME=\i\v</span>. The template above creates them all - by hand it would be more than forty entries."
S2_T = "Step 2: one command per value"
S3 = "A virtual output with this address, plus one of the following lines per command. Analogue values carry <span class='sm-mono'>&lt;v.0&gt;</span> as the placeholder."
S3_T = "Step 3: sending commands to EVCC"
S4 = "Work through the table from top to bottom and the function is rebuilt. The blocks are found in Loxone Config via the block search (F5)."
S4_ERLAEUTERUNG = "<b>On #4:</b> the notification block only fires on a transition from off to on. Never connect several sources directly to its input - merge them through an OR first, otherwise a permanently active source swallows all the others.<br><b>On #5:</b> set the threshold for the failure message well above the poll interval so that a single missed round does not trigger a message."
S4_T = "Step 4: complete block list to rebuild"
S_AUSFALL = "A virtual input keeps its last value when nothing arrives any more - in the app everything then looks normal. Worse: if EVCC does not answer, this plugin reports <b>0</b> for every measured value, and 0 kW of grid import looks like a balanced house. These inputs therefore belong in every installation:"
S_AUSFALL_T = "Step 6: detecting an outage"
S_GEGENPROBE = "Before searching in Loxone, check the three places in this order. <b>1.</b> Open this address in a browser. A line starting with <span class='sm-mono'>EVCC;</span> must appear:"
S_GEGENPROBE_2 = "<b>2.</b> The Test tab carries the same check as its first row - it really calls this endpoint. If it is green, the plugin is not the cause. <b>3.</b> Open the virtual input in Loxone Config and look at the received value. If it stays at 0 while the browser shows a value, the command recognition does not match - compare the search pattern with the field name in the line."
S_GEGENPROBE_T = "Step 8: cross-check - did it arrive?"
S_GRUND = "This is the most frequent question at the Miniserver. EVCC answers it in its own interface; since 0.9.11 the values needed for it are also in the status line. There is deliberately no invented summary code - nobody would have measured it. Instead, read:"
S_GRUND_HINWEIS = "In Loxone a chain of comparators and a status block is enough. Check the rows from top to bottom - the first one that applies is the reason."
S_GRUND_T = "Step 5: why is it not charging right now"
