FEHLER_SPEICHERN = "The configuration could not be written: %s"
FEHLER_TOPIC = "The MQTT topic was not accepted. Allowed are letters, digits, hyphen and underscore, levels separated by a slash — no slash at the start or end, no spaces and no quotation marks, at most 64 characters. The plugin does not remove anything by itself."
FEHLER_PASSWORT_ZEICHEN = "The password contains control characters (line break, tab). It goes into an HTTP header and was therefore not accepted — special characters and spaces inside the password are allowed, control characters are not."
FEHLER_URL = "The address must start with http:// or https://, for example <span class='sm-mono'>http://127.0.0.1:7070</span>."
GESPEICHERT = "Settings saved."
H_FAHRZEUGE = "The order follows the vehicle name in EVCC, alphabetically. If a vehicle is added the assignment may shift - regenerate the template in that case."
