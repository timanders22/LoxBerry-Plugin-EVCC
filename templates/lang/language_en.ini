EVCC_NEU = "EVCC offers a newer version: installed <span class='sm-mono'>%s</span>, available <span class='sm-mono'>%s</span>. The plugin does not update EVCC itself — the package manager does, with <span class='sm-mono'>sudo apt update &amp;&amp; sudo apt install --only-upgrade evcc</span>."
EVCC_NEU_GESPERRT = "EVCC offers a newer version: installed <span class='sm-mono'>%s</span>, available <span class='sm-mono'>%s</span>. Updating from this interface is not enabled — the tick above enables it, then one button press in the Test tab is enough."
EVCC_NEU_KNOPF = "EVCC offers a newer version: installed <span class='sm-mono'>%s</span>, available <span class='sm-mono'>%s</span>. The button <b>Update EVCC now</b> in the Test tab installs whatever the configured package source offers — that is not necessarily the same version; the Test tab names it. It restarts EVCC and interrupts an ongoing charge."
