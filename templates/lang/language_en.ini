H_STEUERUNG_TEXT = "<b>Off by default.</b> EVCC handles surplus charging itself, and does it well. Adding control from Loxone means two hands on the same valve. This permission is meant for cases where Loxone deliberately takes the lead - charge mode by presence or electricity price, for instance."
