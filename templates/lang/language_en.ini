L_URL = "EVCC address"
NICHT_INSTALLIERT = "<b>EVCC is not installed on this LoxBerry.</b> The plugin still works if the address of an EVCC instance on the network is entered above. To run EVCC here, install it with <span class='sm-mono'>curl -1sLf https://dl.evcc.io/public/evcc/stable/setup.deb.sh | sudo -E bash</span> followed by <span class='sm-mono'>sudo apt install evcc</span>."
P_GESETZT = "set - enter again to change"
P_LEER = "no password set"
SETUP_NOETIG = "<b>EVCC has not been set up yet.</b> The service is running and answering but reports <span class='sm-mono'>setupRequired</span> — no wallbox, no meters and no vehicles are configured. As long as that is the case there is nothing to measure, and <span class='sm-mono'>BETRIEBSBEREIT</span> is 0. Set up EVCC first at <a href='%1$s' target='_blank'>%1$s</a>."
SICH_ABGELEHNT = "The file was <b>not</b> accepted — nothing has been changed:"
SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin and can be restored there."
SICH_FEHLEND = "The file is missing %d settings: %s. An incomplete backup is not restored — otherwise the missing values would silently fall back to the factory defaults, with nothing on the page to show it."
SICH_FREMD = "Unknown setting in the file: %s"
SICH_WERT_FORM = "The value of %s is not usable as a setting (wrong type, too long, or containing control characters)."
SICH_WERT_UNZULAESSIG = "The value of %s is not permitted for this setting."
SICH_KEINE_DATEI = "No file was selected, or the upload failed."
SICH_KEIN_JSON = "The file is not a valid backup of this plugin."
SICH_LEER = "The file contains no known setting."
SICH_SCHREIBFEHLER = "The settings could not be written."
SICH_UEBERNOMMEN = "Settings restored: %d values taken over."
SICH_WARNUNG = "<b>The file contains your credentials.</b> Without them all fields would look right after restoring and the plugin still would not reach the installation. Treat the file like a password: do not post it in a forum and do not attach it to a bug report."
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
FEHLER_PASSWORT_RAND = "The password starts or ends with a space. It would get lost in the HTTP header; the password was therefore not accepted."
FEHLER_PASSWORT_LANG = "The password is longer than 256 characters and was not accepted."
FEHLER_GANZZAHL = "%s: please enter a whole number from %d to %d, without decimals and without other characters. Nothing was rounded or saved."
TOKEN_NEU = "<b>A new action token was created on %1$s</b> (%2$s). The addresses in the Miniserver need it - the Loxone integration tab lists them, and a newly generated template already carries it."
SICH_WERT_RAND = "The value of %s has spaces at the start or end. It is not bent into shape - please correct it in the file."
SICH_TOKEN_BLEIBT = "The backup contains no action token (the value is empty). The current token stays, and the addresses in the Miniserver remain valid."
SICH_TOKEN_KEINS = "The backup contains no action token, and none is stored here either. The endpoint therefore rejects every request; a new one is created on the Test tab with the button Generate new token."
H_MQTT_VOLLSEND_V1 = "Otherwise only what has changed is sent; the heartbeat (<span class='sm-mono'>ok</span>, <span class='sm-mono'>ts</span>, <span class='sm-mono'>dienst</span>, <span class='sm-mono'>betriebsbereit</span>) immediately on a change, otherwise at most every 30 seconds. Your gateway is <b>V1</b>: if the <b>Miniserver</b> restarts without the LoxBerry restarting, it lacks the non-retained values until the next change or this full send. <b>Default 15 minutes</b>, <b>0 = off</b> (then only after a LoxBerry restart, an update and a prefix change)."
H_MQTT_VOLLSEND_V2 = "Otherwise only what has changed is sent; the heartbeat (<span class='sm-mono'>ok</span>, <span class='sm-mono'>ts</span>, <span class='sm-mono'>dienst</span>, <span class='sm-mono'>betriebsbereit</span>) immediately on a change, otherwise at most every 30 seconds. Your gateway is <b>V2</b>: it does not pass on a value equal to the last one sent. A full send therefore brings nothing back to a restarted Miniserver; you get the current state with <span class='sm-mono'>resend</span> on the UDP input of the gateway or with a subscription set to <span class='sm-mono'>Noncached</span>. <b>Default 15 minutes</b>, <b>0 = off</b>."
EINGABEN_ZURUECK = "The fields of this form show what you entered, not the saved values - nothing was saved. The rejected field has a red border; for security reasons the password is not filled in again."
SICH_ALTWERT = "<b>This backup could not be restored as it is.</b> The saved value of %s would be rejected on restore (the same check as there). The file is delivered anyway and says so in its header. Correct the value in the interface, save, and then back up again."
H_WACHE = "Writer watch"
H_WACHE_TEXT = "The endpoint remembers who sends switching commands: the identifier from <span class='sm-mono'>&amp;von=</span> (the template sets <span class='sm-mono'>von=loxone</span>) and the sender address. If several writers send commands within the time window, this is shown in the log, in the <i>Test</i> tab and in the response as <span class='sm-mono'>;SCHREIBER=n</span>. Nothing is rejected because of it."
L_WACHE_EIN = "Report several writers (log, Test tab)"
L_WACHE_FENSTER = "Time window of the writer watch (minutes)"
H_WACHE_FENSTER = "1 to 120 minutes, default 15. Within this window, commands from two different senders count as two writers."
L_WACHE_LB = "Also as a LoxBerry notification when new writers appear"
L_WACHE_SPERREN = "Reject foreign writers (HTTP 409)"
H_WACHE_SPERREN = "<b>Off from the factory.</b> Only switch it on when the <i>Test</i> tab has shown only the expected writers for a week. Then every command of a writer not in the list gets HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span> (via MQTT the acknowledgement “abgelehnt: FREMDSCHREIBER”), and nothing goes to EVCC. Withdrawals (battery mode normal, charging plan off, grid charging limit off) are never refused. Commands via MQTT appear as identifier <span class='sm-mono'>mqtt</span> – whoever wants to allow them adds <span class='sm-mono'>mqtt</span> to the list. Caution: a Loxone template without <span class='sm-mono'>von=loxone</span> appears as <i>without identifier</i> and would be locked out with the list <span class='sm-mono'>loxone</span> - then also enter the address of the Miniserver."
L_WACHE_ERLAUBT = "Allowed writers"
H_WACHE_ERLAUBT = "Separated by commas, each entry an identifier (<span class='sm-mono'>loxone</span>), an address (for example that of the Miniserver) or both as identifier@address. At most 16 entries. Only effective with <i>Reject foreign writers</i>. Identifiers of the plugins in this house: <span class='sm-mono'>loxone</span> (Loxone templates), <span class='sm-mono'>einspeisebremse</span> (Einspeisebremse, at actuators with a plugin address), <span class='sm-mono'>awattar</span> (spot price coupling). A path of your own (script, second Miniserver) is best given its own identifier."
FEHLER_WACHE_LISTE = "Allowed writers: not understood: %s. Each entry is an identifier (1 to 32 characters from letters, digits, _ and -), an address or identifier@address, at most 16 entries. Nothing was saved."
FEHLER_WACHE_LANG = "Allowed writers: the list is longer than 512 characters. Nothing was saved."
FEHLER_WACHE_LEER = "Reject foreign writers is switched on, but the list of allowed writers is empty - every command would be rejected, including the one from Loxone. Nothing was saved."
SICH_WACHE_KREUZ = "In the file, Reject foreign writers is switched on but the list of allowed writers is empty - every command would be rejected."
SICH_WACHE_BEHALTEN = "The backup predates the writer watch and does not contain its settings (%s). The current values remain."
WAS_IST_DAS = "<b>EVCC on the LoxBerry, translated for the Loxone Energy Manager.</b> The plugin installs EVCC, the vendor-independent standard for charging on PV surplus, and fetches its values at the configured interval (5 to 60 s) through its REST interface. EVCC works in watts and publishes under its own names; the plugin converts them to the kilowatts the Energy Manager expects at its four inputs. The values reach the Miniserver over MQTT (the regular route) and over a token-protected HTTP endpoint; once enabled, the plugin also accepts commands from there, such as charge mode or charge limit."

[MQTT]
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_TEXT = "The topic group of this plugin is:"
ABO_UNBEKANNT = "The version of your MQTT gateway could not be determined. <b>Version&nbsp;1:</b> without this entry nothing arrives at the Miniserver. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself under Subscriptions, nothing needs to be entered."
ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — nothing needs to be entered here. The group appears under <i>Subscriptions</i>; tick the data points you want there. If it does not appear, nothing has been published yet."
ABO_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> It is the single most common cause of failure. The line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
H_ABO = "The subscription in the MQTT gateway"
H_THEMEN = "Published topics"
H_TITEL = "LoxBerry MQTT gateway"
KEIN_ABSCHNITT = "There is no MQTT section in the LoxBerry <span class='sm-mono'>general.json</span>. The MQTT gateway is part of the system and is switched on under System → MQTT Gateway - it is not a plugin and is not installed separately."
KEIN_AUTOSTART = "The MQTT gateway is not set to autostart (System → MQTT Gateway). Values are sent, but probably nobody is listening."
OK = "The MQTT gateway is set up, UDP input %d."
THEMEN_TEXT = "The third column names the topic under which EVCC publishes the value itself - for looking things up in the EVCC documentation. The plugin converts watts to kilowatts so the values fit the Energy Manager without an intermediate block."
T_BEDEUTUNG = "Meaning"
T_EVCC = "Topic in EVCC"
RETAIN_JA = "yes"
RETAIN_NEIN = "—"
RETAIN_TEXT = "The <i>Retained</i> column says whether the topic is sent with the retain flag. <b>States and settings</b> are retained, <b>time-related measurements</b> — power, energy, prices, remaining times, the measured state of charge — are not, so that no stale value can look current. The <b>heartbeat</b> and <span class='sm-mono'>FEHLER_NR</span> are never retained. If a successful request does not deliver a state (loadpoint missing, start error), it is sent once as “-” with retain, never as an invented 0. <b>The version of your MQTT gateway could not be determined:</b> under <b>V1</b> retained values reach the Miniserver right after a gateway restart; under <b>V2</b> the gateway only keeps them in its cache and passes them on with <span class='sm-mono'>resend</span> or a subscription set to <span class='sm-mono'>Noncached</span>. If you rely on a retained state in Loxone, combine it with <span class='sm-mono'>OK</span> and <span class='sm-mono'>BETRIEBSBEREIT</span>."
T_RETAIN = "Retained"
TS_TEXT = "Time of the last successful poll (Unix seconds, 0 = never) – for reading the time, not for calculating: Loxone calculates in local time, an age from it would be 1–2 h wrong. For failure detection there is <span class='sm-mono'>status/zaehler</span> (tab <i>Integration into Loxone</i>, step 4). <span class='sm-mono'>alter_s</span> does not go via MQTT; via HTTP <span class='sm-mono'>ALTER_S</span> remains."
T_THEMA = "Topic"
RETAIN_TEXT_V1 = "The <i>Retained</i> column says whether the topic is sent with the retain flag. <b>States and settings</b> are retained so that Loxone has the current value right after a gateway restart (your gateway is <b>V1</b>). <b>Time-related measurements</b> - power, energy, prices, remaining times, the measured state of charge - are not. The <b>heartbeat</b> and <span class='sm-mono'>FEHLER_NR</span> are never retained. If a successful request does not deliver a state (loadpoint missing, start error), it is sent once as “-” with retain, never as an invented 0. Only what EVCC delivered in the same run is retained. If you rely on a retained state in Loxone, combine it with <span class='sm-mono'>OK</span> and <span class='sm-mono'>BETRIEBSBEREIT</span>."
RETAIN_TEXT_V2 = "The <i>Retained</i> column says whether the topic is sent with the retain flag. <b>States and settings</b> are retained, <b>time-related measurements</b> are not; the <b>heartbeat</b> and <span class='sm-mono'>FEHLER_NR</span> never. If a successful request does not deliver a state, it is sent once as “-” with retain, never as an invented 0. Your gateway is <b>V2</b>: on reconnecting it only keeps retained messages in its cache and does <b>not</b> pass them on to the Miniserver by itself; equal values are suppressed. After a restart <span class='sm-mono'>resend</span> on the UDP input or a subscription set to <span class='sm-mono'>Noncached</span> fetches the current state. If you rely on a retained state in Loxone, combine it with <span class='sm-mono'>OK</span> and <span class='sm-mono'>BETRIEBSBEREIT</span>."
ABRAEUMEN_OK = "Retained topics under <span class='sm-mono'>%2$s/</span> cleared: the broker confirms that none of the %1$d topics is left."
ABRAEUMEN_REST = "Under <span class='sm-mono'>%2$s/</span> %1$d topics are still retained in the broker after clearing (%3$s). By hand: mosquitto_pub -r -n -t TOPIC."
ABRAEUMEN_UNBEKANNT = "%1$d topics under <span class='sm-mono'>%2$s/</span> sent to the gateway with an empty payload. The broker could not be queried - whether everything is gone has not been read back."
ABRAEUMEN_KEIN_PORT = "The retained topics under <span class='sm-mono'>%s/</span> could not be cleared: general.json names no UDP input port of the gateway."
ABO_MITGELIEFERT = "<b>The plugin brings its subscription itself</b> — nothing has to be entered. The file <span class='sm-mono'>mqtt_subscriptions.cfg</span> in the configuration folder of the plugin carries the topic group; the MQTT gateway reads it itself. It does not appear in the subscription list of the gateway interface, the gateway keeps plugin subscriptions in memory. Whoever changes the prefix gets the file updated on saving."

[LOX]
A_ALTER = "Via HTTP only: age of the last successful poll in seconds. Put the threshold well above the poll interval - 300 s is a good value with an interval of 15 s. Via MQTT there is no age; there the analog value validation on the sign of life reports (step 4)."
A_BETRIEBSBEREIT = "1 as soon as EVCC runs without a startup error and is set up. <b>This is the input that matters:</b> if you wait for usable figures in Loxone, combine OK <b>and</b> BETRIEBSBEREIT — otherwise a 0 is mistaken for a measurement."
A_DIENST = "1 if the systemd service evcc is running. If it is 0 while OK is also 0, the service is the cause and not the network."
A_NR0 = "No error."
A_NR1 = "No answer at all: EVCC is not running, the address is wrong, or the network is down."
A_NR2 = "The answer was not JSON. Usually an intermediate device answered instead of EVCC."
A_NR3 = "EVCC answered with an error code - for instance because the password is missing."
A_NR4 = "EVCC answers but has not been set up — there is nothing to measure."
A_NR5 = "EVCC answers but aborted its startup with an error (for instance an expired sponsor token). The plain text is in the field LETZTER_FEHLER and in the Test tab."
A_OK = "1 as long as the values are current: the last successful request is at most three times the polling interval old (45 s at an interval of 15 s). Older, or EVCC does not answer: 0, and the other values are the last measured state. This is the master switch for everything else."
A_WARNUNG = "Never connect several fault sources directly to the notification block: it only sends on the change from off to on, and a permanently active source swallows all the others. Combine them with an OR first."
BEFEHLE_DOKU_WARNUNG = "The commands marked <b>from the documentation</b> are new in 0.9.11 and have not been measured on any installation. If your EVCC version does not know the path, the endpoint answers with <span class='sm-mono'>OK=0;CODE=404</span> and says explicitly that the command comes from the documentation. It does not bend anything into shape and does not report success."
EM_EINLEITUNG = "The Loxone <b>Energy Manager</b> distributes surplus by priority. It needs four values, and those are exactly what EVCC delivers - only in watts instead of kilowatts. The plugin converts them; the signs already match."
EM_TEXT = "The four inputs of the block and where they come from:"
EM_WARNUNG = "<b>Two hands on the same valve.</b> EVCC already handles surplus charging. Adding the wallbox as a load in the Energy Manager means two systems controlling the same socket. Usually it is better to leave the wallbox to EVCC and let the Energy Manager handle the remaining loads - the charging power then goes in as a <i>status input</i> so the block knows about it when distributing."
G_AUS = "The charging mode is off."
G_KEIN_FZ = "No vehicle plugged in."
G_LAEDT = "It is charging. Everything else is moot."
G_PHASEN = "The phase switch is still running. The value is the remaining time in minutes."
G_PV = "It is waiting for PV surplus. The value is the remaining waiting time in minutes."
G_VOLL = "The charging target has been reached."
H_EM = "Working together with the Energy Manager"
H_EM_TABELLE = "The four values"
H_SCHRITTE = "Integration step by step"
H_VORLAGE = "Create everything at once"
K_VORLAGE_AUS = "Template: virtual outputs"
K_VORLAGE_EIN = "Template: virtual inputs"
Q_DOKU = "from the documentation"
Q_GEMESSEN = "measured"
S1 = "A virtual HTTP input querying this address:"
S1_ABFRAGE = "Poll every 30 s. The token protects the endpoint - it lives in the unauthenticated area so Loxone can reach it without credentials. If you regenerate the token, the address in Loxone must be updated."
S1_T = "virtual HTTP input"
S2 = "One command per value with the recognition pattern <span class='sm-mono'>\i;FIELDNAME=\i\v</span>. The template above creates them all - by hand it would be more than forty entries."
S2_T = "one command per value"
S3 = "A virtual output with this address, plus one of the following lines per command. Analogue values carry <span class='sm-mono'>&lt;v.0&gt;</span> as the placeholder, the price limits and the energy target <span class='sm-mono'>&lt;v.3&gt;</span> (three decimals - with <span class='sm-mono'>&lt;v.0&gt;</span> 0.25 would become a plain 0); the two charging plan commands carry <span class='sm-mono'>&lt;v&gt;</span> (with decimals). The same value is not sent to EVCC twice within 60 s (answer <span class='sm-mono'>UNVERAENDERT=1</span>), a different value at the earliest after 10 s (answer HTTP 429, <span class='sm-mono'>GRUND=BREMSE</span>). Since 0.9.43 the plugin remembers a value refused this way (answer <span class='sm-mono'>NACHREICHEN=1</span>) and sends it itself with the next poll once the 10 s are over - only the last one per command."
S3_T = "sending commands to EVCC"
S4 = "Four pages from the LoxBerry plugins sample project, every row one block; work through a table from top to bottom and the page is rebuilt. The blocks are found in Loxone Config via the block search (F5). The first page shows energy flow, electricity price and state and reports failures and the end of charging - it is enough to start with. The second shows the values of charge point 1, the third controls it from the app, the fourth only belongs to a system whose home battery EVCC itself knows. Charge point 2 has no page of its own: the same rows with lp2."
S4_T = "Step 6: Four complete block lists to rebuild"
S_AUSFALL = "A virtual input keeps its last value when nothing arrives any more - in the app everything then looks normal. Therefore, besides the sign of life (step 4), these inputs belong in every installation:"
S_GEGENPROBE = "Before searching in Loxone, check the three places in this order. <b>1.</b> Open this address in a browser. A line starting with <span class='sm-mono'>EVCC;</span> must appear:"
