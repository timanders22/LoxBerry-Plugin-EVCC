T_THEMA = "Thema"
RETAIN_TEXT_V1 = "Die Spalte <i>Zurückbehalten</i> sagt, ob das Thema mit Retain gesendet wird. <b>Zustände und Einstellungen</b> werden zurückbehalten, damit Loxone nach einem Neustart des Gateways sofort den Stand hat (Ihr Gateway ist <b>V1</b>). <b>Messwerte mit Zeitbezug</b> - Leistungen, Energien, Preise, Restzeiten, der gemessene Ladestand - werden es nicht. Das <b>Lebenszeichen</b> und <span class='sm-mono'>FEHLER_NR</span> werden nie zurückbehalten. Liefert ein gelungener Abruf einen Zustand nicht (Ladepunkt fehlt, Startfehler), geht er einmal als „-“ zurückbehalten hinaus, nie als erfundene 0. Zurückbehalten wird nur, was EVCC im selben Lauf geliefert hat. Wer in Loxone auf einen zurückbehaltenen Zustand baut, verknüpft ihn mit <span class='sm-mono'>OK</span> und <span class='sm-mono'>BETRIEBSBEREIT</span>."
RETAIN_TEXT_V2 = "Die Spalte <i>Zurückbehalten</i> sagt, ob das Thema mit Retain gesendet wird. <b>Zustände und Einstellungen</b> werden zurückbehalten, <b>Messwerte mit Zeitbezug</b> nicht; das <b>Lebenszeichen</b> und <span class='sm-mono'>FEHLER_NR</span> nie. Liefert ein gelungener Abruf einen Zustand nicht, geht er einmal als „-“ zurückbehalten hinaus, nie als erfundene 0. Ihr Gateway ist <b>V2</b>: es legt zurückbehaltene Nachrichten beim Neuverbinden nur in seinen Zwischenspeicher und reicht sie <b>nicht</b> von selbst an den Miniserver weiter; gleiche Werte unterdrückt es. Den Stand nach einem Neustart holt <span class='sm-mono'>resend</span> am UDP-Eingang oder ein Abo auf <span class='sm-mono'>Noncached</span>. Wer in Loxone auf einen zurückbehaltenen Zustand baut, verknüpft ihn mit <span class='sm-mono'>OK</span> und <span class='sm-mono'>BETRIEBSBEREIT</span>."
ABRAEUMEN_OK = "Zurückbehaltene Themen unter <span class='sm-mono'>%2$s/</span> abgeräumt: der Broker bestätigt, dass keines der %1$d Themen mehr steht."
ABRAEUMEN_REST = "Unter <span class='sm-mono'>%2$s/</span> stehen nach dem Abräumen noch %1$d Themen zurückbehalten im Broker (%3$s). Von Hand: mosquitto_pub -r -n -t THEMA."
ABRAEUMEN_UNBEKANNT = "%1$d Themen unter <span class='sm-mono'>%2$s/</span> mit leerer Nutzlast an das Gateway geschickt. Der Broker ließ sich nicht befragen - ob alles weg ist, ist nicht nachgelesen."
ABRAEUMEN_KEIN_PORT = "Die zurückbehaltenen Themen unter <span class='sm-mono'>%s/</span> ließen sich nicht abräumen: in der general.json steht kein UDP-Eingangsport des Gateways."

[LOX]
A_ALTER = "Alter des letzten geglückten Abrufs in Sekunden. Schwelle deutlich über den Abholtakt legen - 300 s sind bei einem Takt von 15 s ein guter Wert, damit ein einzelner verpasster Durchlauf keine Meldung auslöst."
A_BETRIEBSBEREIT = "1, sobald EVCC ohne Startfehler läuft und eingerichtet ist. <b>Das ist der Eingang, auf den es ankommt:</b> wer in Loxone auf brauchbare Zahlen wartet, verknüpft OK <b>und</b> BETRIEBSBEREIT — sonst hält er eine 0 für eine Messung."
A_DIENST = "1, wenn der systemd-Dienst evcc läuft. Steht er auf 0, während OK ebenfalls 0 ist, liegt es am Dienst und nicht am Netz."
A_NR0 = "Kein Fehler."
A_NR1 = "Es kam gar keine Antwort: EVCC läuft nicht, die Adresse stimmt nicht, oder das Netz ist weg."
A_NR2 = "Die Antwort war kein JSON. Meist hat eine Zwischenstelle geantwortet und nicht EVCC."
A_NR3 = "EVCC hat mit einem Fehlercode geantwortet - etwa, weil das Passwort fehlt."
A_NR4 = "EVCC antwortet, ist aber nicht eingerichtet — es gibt nichts zu messen."
A_NR5 = "EVCC antwortet, hat den Start aber mit einem Fehler abgebrochen (etwa ein abgelaufenes Sponsor-Token). Der Klartext steht im Feld LETZTER_FEHLER und im Reiter Test."
A_OK = "1, solange die Werte aktuell sind: der letzte gelungene Abruf ist höchstens dreimal so alt wie der Abruftakt (bei Takt 15 s also 45 s). Älter, oder EVCC antwortet nicht: 0, und die übrigen Werte sind der zuletzt gemessene Stand. Das ist der Hauptschalter für alles Weitere."
A_WARNUNG = "Verbinden Sie niemals mehrere Störungsquellen unmittelbar mit dem Benachrichtigungs-Baustein: der sendet nur beim Wechsel von Aus auf Ein, und eine dauerhaft anliegende Quelle verschluckt alle übrigen. Erst über ODER zusammenführen."
BEFEHLE_DOKU_WARNUNG = "Die mit <b>aus der Dokumentation</b> gekennzeichneten Befehle sind neu in 0.9.11 und an keiner Anlage gemessen. Kennt Ihre EVCC-Fassung den Pfad nicht, antwortet der Endpunkt mit <span class='sm-mono'>OK=0;CODE=404</span> und sagt ausdrücklich, dass der Befehl aus der Dokumentation stammt. Er biegt nichts zurecht und meldet keinen Erfolg."
EM_EINLEITUNG = "Der Loxone-<b>Energiemanager</b> verteilt Überschuss nach Priorität. Er braucht vier Größen, und genau die liefert EVCC - nur in Watt statt Kilowatt. Das Plugin rechnet um; die Vorzeichen passen bereits."
EM_TEXT = "Die vier Eingänge des Bausteins und woher sie kommen:"
EM_WARNUNG = "<b>Zwei Regler am selben Ventil.</b> EVCC regelt das Überschussladen bereits selbst. Wer die Wallbox zusätzlich als Last in den Energiemanager hängt, lässt zwei Systeme dieselbe Steckdose steuern. Sinnvoller ist meist: die Wallbox EVCC überlassen und den Energiemanager nur die übrigen Verbraucher regeln lassen - die Ladeleistung geht dann als <i>Statuseingang</i> hinein, damit er sie beim Verteilen kennt."
G_AUS = "Der Lademodus steht auf aus."
G_KEIN_FZ = "Kein Fahrzeug angesteckt."
G_LAEDT = "Es lädt. Alles Weitere erübrigt sich."
G_PHASEN = "Die Phasenumschaltung läuft noch. Der Wert ist die verbleibende Zeit in Minuten."
G_PV = "Es wartet auf PV-Überschuss. Der Wert ist die verbleibende Wartezeit in Minuten."
G_VOLL = "Das Ladeziel ist erreicht."
H_EM = "Zusammenspiel mit dem Energiemanager"
H_EM_TABELLE = "Die vier Größen"
H_SCHRITTE = "Einbindung Schritt für Schritt"
H_VORLAGE = "Alles auf einmal anlegen"
K_VORLAGE_AUS = "Vorlage: virtuelle Ausgänge"
K_VORLAGE_EIN = "Vorlage: virtuelle Eingänge"
Q_DOKU = "aus der Dokumentation"
Q_GEMESSEN = "gemessen"
S1 = "Ein virtueller HTTP-Eingang, der diese Adresse abfragt:"
S1_ABFRAGE = "Abfrage alle 30 s. Das Token schützt den Endpunkt - er liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Wer das Token neu erzeugt, muss die Adresse in Loxone anpassen."
S1_T = "Schritt 1: Virtueller HTTP-Eingang"
S2 = "Je Wert ein Befehl mit Befehlserkennung <span class='sm-mono'>\i;FELDNAME=\i\v</span>. Das legt die Vorlage oben von selbst an - von Hand wären es über vierzig Einträge."
S2_T = "Schritt 2: Befehle je Wert"
S3 = "Ein virtueller Ausgang mit dieser Adresse, dazu je Befehl eine der folgenden Zeilen. Analogwerte tragen <span class='sm-mono'>&lt;v.0&gt;</span> als Platzhalter, die Preisgrenzen und das Energieziel <span class='sm-mono'>&lt;v.3&gt;</span> (drei Nachkommastellen - mit <span class='sm-mono'>&lt;v.0&gt;</span> würden aus 0,25 glatte 0); die beiden Befehle für den Ladeplan tragen <span class='sm-mono'>&lt;v&gt;</span> (mit Nachkommastellen). Derselbe Wert geht innerhalb von 60 s nicht zweimal an EVCC (Antwort <span class='sm-mono'>UNVERAENDERT=1</span>), ein anderer Wert frühestens nach 10 s (Antwort HTTP 429, <span class='sm-mono'>GRUND=BREMSE</span>). Seit 0.9.43 merkt sich das Plugin einen so abgewiesenen Wert (Antwort <span class='sm-mono'>NACHREICHEN=1</span>) und reicht ihn nach Ablauf der 10 s mit dem nächsten Abruf selbst nach - je Befehl nur den letzten."
S3_T = "Schritt 3: Befehle an EVCC senden"
S4 = "Vier Seiten aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein; wer eine Tabelle von oben nach unten abarbeitet, hat die Seite nachgebaut. Die Bausteine findet man in Loxone Config über die Baustein-Suche (F5). Die erste Seite zeigt Energiefluss, Strompreis und Zustand und meldet Störungen und das Ladeende - sie genügt für den Anfang. Die zweite zeigt die Werte des Ladepunkts 1, die dritte stellt ihn aus der App, die vierte gehört nur zu einer Anlage, deren Hausspeicher EVCC selbst kennt. Ladepunkt 2 hat keine eigene Seite: dieselben Zeilen mit _LP2."
S4_T = "Schritt 4: Vier komplette Baustein-Listen zum Nachbauen"
S_AUSFALL = "Ein virtueller Eingang behält seinen letzten Wert, wenn nichts mehr kommt - in der App sieht dann alles normal aus. Vor dem ersten gelungenen Abruf antwortet dieses Plugin mit HTTP 503; danach bleiben bei einem Ausfall die letzten Werte stehen, und <span class='sm-mono'>OK</span> geht auf 0. Ein Zustand, den EVCC nicht liefert, steht auf -1. Deshalb gehören diese Eingänge in jede Anlage:"
S_AUSFALL_T = "Schritt 6: Ausfallerkennung"
S_GEGENPROBE = "Bevor Sie in Loxone suchen, prüfen Sie die drei Stellen in dieser Reihenfolge. <b>1.</b> Diese Adresse im Browser aufrufen. Es muss eine Zeile erscheinen, die mit <span class='sm-mono'>EVCC;</span> beginnt:"
S_GEGENPROBE_2 = "<b>2.</b> Im Reiter Test steht dieselbe Prüfung als erste Zeile - sie ruft diesen Endpunkt wirklich auf. Ist sie grün, liegt es nicht am Plugin. <b>3.</b> In Loxone Config den virtuellen Eingang öffnen und den empfangenen Wert ansehen. Bleibt er auf 0, während der Browser einen Wert zeigt, stimmt die Befehlserkennung nicht - vergleichen Sie das Suchmuster mit dem Feldnamen in der Zeile."
S_GEGENPROBE_T = "Schritt 8: Gegenprobe - ist es angekommen?"
S_GRUND = "Das ist die häufigste Rückfrage am Miniserver. EVCC beantwortet sie in seiner eigenen Oberfläche; die dafür nötigen Werte stehen seit 0.9.11 auch in der Statuszeile. Einen erfundenen Sammelcode gibt es bewusst nicht - den hätte niemand gemessen. Statt dessen lesen Sie ab:"
S_GRUND_HINWEIS = "In Loxone genügt dafür ein Status-Baustein mit diesen Zeilen in dieser Reihenfolge - die erste zutreffende ist der Grund. Die Baustein-Liste in Schritt 4 baut ihn fertig auf (Seite „EVCC“, #3 „Wallbox Status“)."
S_GRUND_T = "Schritt 5: Warum lädt es gerade nicht"
