VON_HINWEIS = "Jede Befehlsadresse trägt <span class='sm-mono'>&amp;von=loxone</span>. Daran unterscheidet die Schreiber-Wache (Reiter <i>Einstellungen</i>) den Miniserver von anderen Schreibern. Eine ältere Vorlage ohne diesen Zusatz arbeitet weiter und erscheint im Reiter <i>Test</i> als <i>ohne Kennung</i>. Es genügt, an die bestehenden Befehle <span class='sm-mono'>&amp;von=loxone</span> anzuhängen; ein zweiter Import legte die Bausteine doppelt an."
