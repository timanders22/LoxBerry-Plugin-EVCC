HINWEISE_TITEL = "Hinweise"
S1_SCHRITT1 = "EVCC selbst einrichten: Wallbox, Zähler und Fahrzeug in der EVCC-Oberfläche (Port 7070). Das Plugin liest nur, was dort steht. Wer nach Strompreis laden will, trägt dort auch den Tarif ein."
S1_SCHRITT2 = "Im Plugin Reiter „%s“: „%s“ prüfen, „%s“ und „%s“ je 2 lassen, „%s“ anhaken (nur mit Tarif in EVCC) und „%s“ anhaken (für die Lademodus-Wahl und die Seiten „EVCC Steuerung“ und „EVCC Hausspeicher und Tarif“). Speichern."
S1_SCHRITT3 = "Reiter „%s“: „%s“ bleibt an, Thema „%s“. Bei MQTT-Gateway V1 das Abo „%s/#“ eintragen, wie der Reiter es zeigt – nur für die beiden Texteingänge nötig, alle Zahlen kommen über HTTP."
S1_SCHRITT4 = "Oben in diesem Reiter „%s“ und „%s“ drücken (der zweite Knopf erscheint erst mit der Freigabe aus Schritt 2)."
S1_SCHRITT5 = "In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren → VI_evcc.xml; Peripherie → Virtuelle Ausgänge → Vorlage importieren → VQ_evcc.xml. Jede Datei nur EINMAL einlesen (zweimal ergibt doppelte Bausteine)."
S1_SCHRITT6 = "Seite „EVCC“ anlegen und die Werte der Liste aus „%s“ auf die Seite ziehen, dazu aus „%s“ den Befehl %s."
S1_SCHRITT7 = "Peripherie → Virtuelle Eingänge → Virtueller Texteingang, Name genau so: %s – so, wie das MQTT-Gateway das Thema benennt. Unter Gateway V2 den Datenpunkt in den Subscriptions anhaken."
S1_SCHRITT8 = "Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Ladung fertig“ und „EVCC Meldung“, Texte wie in der Liste. Jede bekommt genau eine Leitung."
S1_SCHRITT9 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. ODER und UND haben je zwei Eingänge. Zu #21 (Analogwertvalidierung): Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
S1_SCHRITT10 = "Status-Bausteine: die Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein (#3 viermal, #16 und #27 je zweimal, #40 dreimal). Die Zeilen stehen in der Spalte „%s“ und werden von Hand eingetragen, in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt."
S1_SCHRITT11 = "Radiotasten „Lademodus Ladepunkt 1“: drei Tasten benennen, Text für „keine Taste gewählt“ „Aus“, Remanenz ein."
S1_SCHRITT12 = "Energiemanager: im Eigenschaftsfenster Verbraucher 1 „Wallbox (EVCC regelt)“ anlegen (Name wie in der Tabelle), seinen Ausgang OL1 NICHT verbinden, die Rückmeldung IL1 an %s. MinSoc 20 %%. Die Wallbox schaltet EVCC, nicht der Energiemanager."
S1_SCHRITT13 = "Speichern und in den Miniserver übertragen. Probe: „EVCC Zustand“ zeigt „in Ordnung“, „Energiefluss“ dieselben Zahlen wie die EVCC-Oberfläche; im Plugin Reiter „%s“ ist die erste Zeile grün."
S1_H1 = "In der App „Lademodus Ladepunkt 1“ wählen. Wählt jemand den Modus in der EVCC-App, bleibt er, bis in Loxone neu gewählt wird; den tatsächlichen Modus zeigt „Wallbox Status“."
S1_H2 = "Nicht zwei Preisautomatiken bauen: ob nach Preis geladen wird, entscheidet EVCC (Preisgrenze auf der Seite „EVCC Steuerung“). „Günstige Stunde“ (#10/#11) ist eine Anzeige und der Anschluss für eigene Verbraucher, NICHT für den Lademodus."
S1_H3 = "Wer im Plugin die Sprachausgabe einschaltet, bekommt Ausfall und Ladeende doppelt (Ansage und Benachrichtigung) – eins abwählen."
S1_H4 = "Läuft EVCC auf einem anderen Rechner, steht %s immer auf 0; „EVCC Zustand“ wertet ihn nur aus, wenn EVCC nicht antwortet."
S1_H5 = "Nach „%s“ (Reiter „%s“) die Adresse des Virtuellen HTTP-Eingangs und des Virtuellen Ausgangs erneuern."
S1_H6 = "Die Schwelle der Solarprognose (#13) zuerst ablesen: zeigt „Solarprognose“ Zahlen über 1000, liefert EVCC Wh – dann die Schwellen mal 1000."
S1_H7 = "Wer diese Seite nach der Liste von 0.9.42 gebaut hat: dort hing %s an „Günstig und Preis gültig“ und schaltete den Lademodus in jeder nicht günstigen Stunde auf AUS. Vor dem Umbau die Leitungen #4 (Ausgang Off) → #5, #8 → #9 und #11 → #12 löschen, dann wie in der Liste verbinden."
S2_SCHRITT1 = "Vorlagen wie auf Seite „EVCC“ (ein Import reicht für alle vier Seiten)."
S2_SCHRITT2 = "Seite „EVCC Ladepunkt 1“ anlegen und die 26 Werte der Liste aus „%s“ ziehen. Bei %s im Eigenschaftsfenster „Statistik“ einschalten."
S2_SCHRITT3 = "Peripherie → Virtuelle Eingänge → Virtueller Texteingang, Name genau so: %s. Unter Gateway V2 den Datenpunkt in den Subscriptions anhaken."
S2_SCHRITT4 = "Fünf Status-Bausteine setzen; die Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein (#9 viermal, #16 zweimal, #24 dreimal). Die Zeilen aus der Spalte „%s“ von Hand eintragen, die Zeile ohne Bedingung zuletzt. Verbinden, speichern, übertragen."
S2_H1 = "Kosten, Preis je kWh und CO₂ der Sitzung gibt es nur mit einem Tarif in EVCC; sonst stehen dort 0."
S2_H2 = "-1 heißt: EVCC liefert diesen Wert nicht (kein Fahrzeug, kein Plan) – kein Fehler."
S2_H3 = "Ladepunkt 2: dieselbe Seite mit _LP2 und dem Texteingang %s nachbauen."
S3_SCHRITT1 = "Im Plugin Reiter „%s“ muss „%s“ angehakt sein – sonst antwortet jeder Befehl mit einer Abweisung, und es gibt keine Ausgangsvorlage."
S3_SCHRITT2 = "Seite „EVCC Steuerung“ anlegen und die 13 Befehle der Liste aus „%s“ ziehen."
S3_SCHRITT3 = "Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang, „In Visualisierung verwenden“ an): Schieberegler mit Min, Max, Schritt und Startwert wie in der Liste; Schalter „Battery Boost Ladepunkt 1“ (Startwert aus); Tasten „Ladeplan löschen“ und „Fahrzeug-Zuordnung lösen“."
S3_SCHRITT4 = "Radiotasten „Phasen Ladepunkt 1“ (zwei Tasten, „keine Taste gewählt“ = „automatisch“, Remanenz ein) und Formel IF(I1==2;3;I1) setzen. Verbinden, speichern, übertragen."
S3_SCHRITT5 = "Wer die Vorlage „%s“ vor 0.9.43 eingelesen hat: dort bei %s und %s den Befehl bei EIN von „…&wert=<v.0>“ auf „…&wert=<v.3>“ ändern, nicht neu einlesen. Ab 0.9.43 bringt die Vorlage <v.3> selbst mit."
S3_SCHRITT6 = "Probe: die Ladegrenze verstellen und 15 s warten – auf Seite „EVCC“ zeigt %s den neuen Wert, ebenso die EVCC-Oberfläche."
S3_H1 = "Befehlsbremse: Das Plugin nimmt je Befehl höchstens alle 10 s einen neuen Wert an. Wird ein Regler schneller verstellt, weist es den Wert mit HTTP 429 ab, merkt ihn sich aber und reicht ihn nach Ablauf der 10 s mit dem nächsten Abruf selbst nach – je Befehl nur den letzten (seit 0.9.43). Die Rückmeldung steht danach auf Seite „EVCC Ladepunkt 1“."
S3_H2 = "Ladeplan: zuerst „Abfahrt Ziel-Ladestand“, dann „Abfahrt in Stunden“ einstellen – der Plan gilt ab dem Moment, in dem der zweite Wert ankommt. Wird später nur das Ziel verstellt, rechnet das Plugin die Stunden ab DIESEM Moment neu."
S3_H3 = "Battery Boost aus lassen, wenn der Hausspeicher Vorrang vor dem Auto hat (README, Abschnitt „EVCC neben Hausspeichern“)."
S3_H4 = "„Energieziel“ nur für Fahrzeuge, die ihren Ladestand nicht melden; sonst „Ladegrenze“ nehmen."
S3_H5 = "Fahrzeug fest wählen (nicht Teil der Liste): Die Vorlage enthält je Fahrzeug, das EVCC beim letzten Abruf gemeldet hat, einen Digitalbefehl mit festem Namen, %s usw. (Reihenfolge wie die Fahrzeuge auf Seite „EVCC Ladepunkt 1“, Kommentar = Fahrzeugname); je Befehl eine Taste. Ohne gelungenen Abruf fehlen diese Befehle – dann die Vorlage danach erneut holen und nur die neuen Befehle von Hand anlegen."
S3_H6 = "Ladepunkt 2: dieselben Zeilen mit den Befehlen auf _LP2."
S4_SCHRITT1 = "Nur übernehmen, wenn EVCC selbst einen Hausspeicher kennt (EVCC-Oberfläche). Führt Loxone oder ein anderes Plugin den Speicher (BatterieBMS, Einspeisebremse, AnkerSolix, Zendure), die Befehle #1–#14 weglassen – sonst schalten zwei Regler denselben Speicher. Die Werte #15–#33 schaden nie."
S4_SCHRITT2 = "Seite „EVCC Hausspeicher und Tarif“ anlegen, die 7 Befehle der Liste aus „%s“ und die 16 Werte aus „%s“ ziehen."
S4_SCHRITT3 = "Virtuelle Eingänge (Schieberegler, Schalter, Taste) wie in der Liste anlegen, „In Visualisierung verwenden“ an; Radiotasten „Hausspeicher Betriebsart“ (zwei Tasten, „keine Taste gewählt“ = „normal“, Remanenz ein)."
S4_SCHRITT4 = "Status #23 und #30: die Eingänge ab V5 erscheinen erst nach Klick auf das „+“ (#23 viermal, #30 zweimal); die Zeilen aus der Spalte „%s“ von Hand eintragen. Verbinden, speichern, übertragen."
S4_SCHRITT5 = "Wer die Vorlage „%s“ vor 0.9.43 eingelesen hat: dort bei %s den Befehl bei EIN von „…&wert=<v.0>“ auf „…&wert=<v.3>“ ändern, nicht neu einlesen."
S4_H1 = "„halten“ und „aus dem Netz laden“ wirken, bis „normal“ gewählt wird. Nach einem Neustart des Miniservers bleibt die Wahl (Remanenz)."
S4_H2 = "Residualleistung: bei Zwangsentladung eines anderen Speichers dessen Entladeleistung hier mit eintragen, sonst lädt EVCC das Auto aus diesem Speicher (README, Abschnitt „EVCC neben Hausspeichern“)."
S4_H3 = "„Netzladen Hausspeicher aus“ löscht die Grenze in EVCC; der Regler zeigt danach noch den alten Wert – erst ein neues Verstellen setzt sie wieder."
S4_H4 = "Befehlsbremse wie auf Seite „EVCC Steuerung“: ein Wert, der weniger als 10 s nach dem vorigen kommt, wird abgewiesen und nach Ablauf der 10 s nachgereicht – nur der letzte."
