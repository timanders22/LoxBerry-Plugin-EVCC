[SPOT]
EINLEITUNG = "EVCC kennt den <b>Börsenstrompreis</b> (Tibber, aWATTar, Octopus, EPEX Spot) und kann davon abhängig laden. Das Plugin reicht Preis und Schaltzustand nach Loxone durch - <b>die Entscheidung selbst trifft EVCC</b>, nicht Loxone."
GESPERRT = "Die Tarifwerte erscheinen, sobald im Reiter Einstellungen <i>Tarife übernehmen</i> angehakt ist. Ohne einen in EVCC eingerichteten Tarif liefert EVCC dort nichts - dann bleibt der Haken besser aus, statt vierzig Nullen nach Loxone zu schicken."
GRENZE_EINHEIT = "<b>Einheit beachten:</b> die Grenze wird in der <b>Währung pro kWh</b> angegeben, also <span class='sm-mono'>0.25</span> für 25&nbsp;Cent - nicht in Cent. Deshalb <span class='sm-mono'>&lt;v.3&gt;</span> mit drei Nachkommastellen; mit <span class='sm-mono'>&lt;v.0&gt;</span> würden aus 0,25 glatte 0, und die Wallbox lüde nur noch bei negativen Preisen."
GRENZE_GESPERRT = "Die Grenze aus Loxone zu setzen geht erst, wenn im Reiter Einstellungen die Steuerung aus Loxone freigegeben ist. Ablesen lässt sich der Preis auch ohne das."
GRENZE_TEXT = "Bis zu welchem Preis geladen werden darf, steht in EVCC als <span class='sm-mono'>smartCostLimit</span>. Wer die Grenze in Loxone einstellbar machen will - etwa über einen Merker oder eine Visualisierung - legt dafür einen virtuellen Ausgang an:"
H = "Laden nach Strompreis (Smart Cost)"
H_GRENZE = "Die Preisgrenze aus Loxone setzen"
H_REZEPT = "Ein brauchbarer Aufbau in Loxone"
H_WERTE = "Diese Werte stehen bereit"
RANG_REZEPT = "<b>Der Rang ist die nützliche Zahl - zusammen mit <span class='sm-mono'>EVCC_PREIS_OK</span>.</b> Statt in Loxone eine zweite Preisautomatik zu bauen, genügt ein Vergleicher: <span class='sm-mono'>EVCC_PREIS_RANG kleiner gleich 6</span> heißt sinngemäß in den sechs günstigsten der bekannten Stunden. <b>Nur zusammen mit <span class='sm-mono'>EVCC_PREIS_OK = 1</span> freigeben</b> (über ein UND): ohne gültige Preise steht der Rang auf -1, und ein Vergleich auf kleiner gleich 6 wäre sonst immer wahr. Die Entscheidung, wann wirklich geladen wird, trifft weiterhin EVCC."
REZEPT = "Bewährt hat sich: <span class='sm-mono'>EVCC_TARIF_NETZ</span> als Analogeingang auf einen <b>Statistik</b>-Baustein, damit der Preisverlauf im Tagesdiagramm sichtbar wird. <span class='sm-mono'>EVCC_LP1_SMARTCOST_AKTIV</span> auf eine Statusanzeige - dann ist auf einen Blick zu sehen, ob gerade wegen des günstigen Preises geladen wird oder aus einem anderen Grund. Und wer eine Preisgrenze in der Visualisierung möchte: einen <b>Analogspeicher</b> mit Schrittweite 0,01 auf den virtuellen Ausgang von oben."
WARNUNG = "<b>Nicht zwei Automatiken bauen.</b> Es ist verlockend, in Loxone eine eigene Logik zu schreiben, die bei billigem Strom den Lademodus auf <i>now</i> stellt. Das arbeitet dann gegen die Preisautomatik von EVCC: EVCC schaltet ab, weil der Preis wieder gestiegen ist, Loxone schaltet im nächsten Zyklus erneut ein. Entweder EVCC regelt (dann in Loxone nur ablesen und höchstens die Grenze setzen) oder Loxone regelt (dann in EVCC keinen Tarif hinterlegen)."
WERTE_TEXT = "Die Namen entsprechen den Befehlserkennungen der Vorlage für virtuelle Eingänge. Die Preise kommen in der Währung des Tarifs, je kWh."
Z_AKTIV = "1, solange EVCC gerade <i>wegen des günstigen Preises</i> lädt. Genau der Wert, den man in Loxone anzeigen will - nicht der Preis selbst."
Z_ANZAHL = "Wie viele Stunden die Vorschau umfasst (-1 = keine gültigen Preise)"
Z_BESTE = "Tagesstunde mit dem niedrigsten Preis (0 bis 23, -1 = keine gültigen Preise)"
Z_CO2 = "CO₂-Anteil des Netzstroms in g/kWh, wenn ein entsprechender Tarif eingerichtet ist. EVCC kann statt nach Preis auch danach laden."
Z_EINSPEISUNG = "Vergütung je eingespeister kWh. Bei den meisten Anlagen eine feste Zahl."
Z_MAX = "Höchster bekannter Arbeitspreis der Vorschau"
Z_MIN = "Niedrigster bekannter Arbeitspreis der Vorschau"
Z_NETZ = "Aktueller Arbeitspreis je kWh aus dem Netz. Bei Spottarifen ändert er sich stündlich, bei Festtarifen steht er still - beides ist richtig."
Z_RANG = "Rang der laufenden Stunde - 1 ist die günstigste, -1 heißt: keine gültigen Preise"
Z_SCHNITT = "Durchschnitt über alle bekannten Stunden"
Z_OK = "1, wenn die Preise für die laufende Stunde gelten (frisch geholt oder aus einem früheren Abruf, solange er die Stunde abdeckt), sonst 0. Rang, Stundenzahl und beste Stunde gelten nur zusammen mit 1."

[DIREKT]
ABWAEGUNG = "<b>Was dafür spricht:</b> ein Zwischenglied weniger. Fällt der LoxBerry aus, während EVCC weiterläuft, schaltet Loxone trotzdem.<br><b>Was dagegen spricht:</b> es gibt keine Rückmeldung, die Loxone auswerten könnte - der Endpunkt dieses Plugins antwortet mit <span class='sm-mono'>OK=1</span> oder einem Grund, EVCC antwortet mit rohem JSON. Es gibt keine Prüfung der Wertebereiche; ein vertippter Ladestand von 1000 geht ungefiltert durch. Und es steht nichts im Protokoll dieses Plugins, wenn hinterher jemand fragt, wer die Wallbox abgeschaltet hat. <b>Empfehlung:</b> den Weg über das Plugin nehmen und diesen hier als Rückfallebene kennen."
EINLEITUNG = "Loxone kann EVCC auch <b>ohne dieses Plugin</b> ansprechen - die REST-Schnittstelle von EVCC nimmt einfache Aufrufe entgegen. Das ist als Rückfallebene gedacht, nicht als der bessere Weg."
H = "Rückfallebene: Loxone spricht direkt mit EVCC"
H_ABWAEGUNG = "Abwägung"
H_BEDINGUNG = "Eine Bedingung - und sie ist hart"
METHODE = "Im virtuellen Ausgang die <b>Methode POST</b> einstellen (bei manchen Pfaden erwartet EVCC PUT - steht in der EVCC-Dokumentation unter <span class='sm-mono'>/api/</span>). Der Ladepunkt zählt hier ab 1, wie in der EVCC-Oberfläche."
PASSWORT_GESETZT = "<b>Hier nicht möglich.</b> Für diese EVCC-Instanz ist im Reiter Einstellungen ein Passwort hinterlegt. EVCC erwartet es dann als <span class='sm-mono'>Authorization: Bearer</span>-Kopfzeile - und ein virtueller Ausgang in Loxone Config kann keine freie Kopfzeile mitschicken (das Feld für Benutzer und Passwort erzeugt <i>Basic</i>-Authentifizierung, die EVCC nicht annimmt). Der Weg über dieses Plugin ist hier der einzige - es setzt die Kopfzeile selbst."
PASSWORT_LEER = "Für diese EVCC-Instanz ist kein Passwort hinterlegt. Damit nimmt EVCC Aufrufe ohne Anmeldung an, und ein virtueller Ausgang in Loxone kann sie direkt absetzen. <b>Zu bedenken:</b> das gilt dann für jeden im Netz, nicht nur für Loxone."
Z_BATTERIE = "Hausspeicher sperren (<span class='sm-mono'>normal</span>, <span class='sm-mono'>hold</span> oder <span class='sm-mono'>charge</span>)."
Z_LIMITSOC = "Ziel-Ladestand des Fahrzeugs in Prozent."
Z_MODUS = "Lademodus setzen (<span class='sm-mono'>off</span>, <span class='sm-mono'>now</span>, <span class='sm-mono'>minpv</span> oder <span class='sm-mono'>pv</span>)."

