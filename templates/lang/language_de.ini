RETAIN_TEXT = "Die Spalte <i>Zurückbehalten</i> sagt, ob das Thema mit Retain gesendet wird. <b>Zustände und Einstellungen</b> werden zurückbehalten, <b>Messwerte mit Zeitbezug</b> — Leistungen, Energien, Preise, Restzeiten, der gemessene Ladestand — nicht, damit kein alter Wert als aktuell erscheint. Das <b>Lebenszeichen</b> und <span class='sm-mono'>FEHLER_NR</span> werden nie zurückbehalten. Liefert ein gelungener Abruf einen Zustand nicht (Ladepunkt fehlt, Startfehler), geht er einmal als „-“ zurückbehalten hinaus, nie als erfundene 0. <b>Die Fassung Ihres MQTT-Gateways war nicht festzustellen:</b> unter <b>V1</b> kommen zurückbehaltene Werte nach einem Neustart des Gateways sofort am Miniserver an; unter <b>V2</b> legt das Gateway sie nur in seinen Zwischenspeicher und reicht sie erst mit <span class='sm-mono'>resend</span> oder einem Abo auf <span class='sm-mono'>Noncached</span> weiter. Wer in Loxone auf einen zurückbehaltenen Zustand baut, verknüpft ihn mit <span class='sm-mono'>OK</span> und <span class='sm-mono'>BETRIEBSBEREIT</span>."
